name: Deploy Django app to Azure Web App - forceSales

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forcesales2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Check app before deployment
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test --noinput
          python scripts/smoke_startup.py

      - name: Package tracked application files
        run: git archive --format=zip --output=app.zip HEAD

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: forceSales2
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
          clean: true
